name: Apply integration fixes

on:
  push:
    paths:
      - '.github/workflows/apply_fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'PY'
          import re, sys, io

          def load(p):
              with io.open(p, 'r', encoding='utf-8', newline='') as f:
                  return f.read()

          def save(p, s):
              with io.open(p, 'w', encoding='utf-8', newline='') as f:
                  f.write(s)

          def sub_once(text, pattern, repl, label):
              rx = re.compile(pattern, re.MULTILINE)
              hits = rx.findall(text)
              if len(hits) != 1:
                  sys.exit('ANCHOR FAILED (%d matches, expected 1): %s' % (len(hits), label))
              out = rx.sub(repl, text, count=1)
              print('patched: %s' % label)
              return out

          # ---------------- game.js ----------------
          g = load('game.js')

          def p1(m):
              i = m.group(1)
              L = [
                "// Facing rotation must NOT be written onto rig.group: fly_rig.js sets",
                "// that group's rotation.x = -PI/2 to convert its native +Z-up space",
                "// into three.js +Y-up. Writing .y there yaws about a pre-conversion",
                "// axis (Euler XYZ applies Ry inside Rx) and also corrupts",
                "// applyImpulse()'s group-quaternion inverse. Wrap the rig instead and",
                "// put position + facing on the wrapper.",
                "const flyRoot = new THREE.Group();",
                "flyRoot.name = 'fly-root';",
                "flyRoot.position.copy(rig.group.position);",
                "flyRoot.rotation.y = Math.PI;",
                "rig.group.position.set(0, 0, 0);",
                "flyRoot.add(rig.group);",
                "fly.root = flyRoot;",
                "",
                "// fly_rig.js documents floorY as world-space and defaults it to 0, so",
                "// its leg-tip floor contact never engaged for a fly standing on the",
                "// desk. Hand it the desk surface height.",
                "rig.floorY = world.deskTopY + 0.035;",
              ]
              return '\n'.join((i + x) if x else '' for x in L)

          g = sub_once(g, r'^([ \t]*)rig\.group\.rotation\.y = Math\.PI;[ \t]*$', p1,
                       'game.js: wrap rig.group instead of overwriting its rotation')

          g = sub_once(g, r'^([ \t]*)world\.scene\.add\(rig\.group\);[ \t]*$',
                       lambda m: m.group(1) + 'world.scene.add(flyRoot);',
                       'game.js: add the wrapper to the scene')

          def p3(m):
              i = m.group(1)
              L = [
                "// fly_rig.js only undoes its OWN group rotation, so bring the world",
                "// direction into the wrapper's frame before handing it over.",
                "let impulseDir = direction;",
                "if (fly.root && direction && typeof direction.clone === 'function') {",
                "  impulseDir = direction.clone().applyQuaternion(",
                "    fly.root.getWorldQuaternion(new THREE.Quaternion()).invert());",
                "}",
                "fly.rig.applyImpulse(impulseDir, strength);",
              ]
              return '\n'.join(i + x for x in L)

          g = sub_once(g, r'^([ \t]*)fly\.rig\.applyImpulse\(direction, strength\);[ \t]*$', p3,
                       'game.js: map impulse direction through the wrapper')

          g = sub_once(g, r'^([ \t]*)neuroSim\.setDrive\(',
                       lambda m: m.group(1) + 'if (neuroSim) neuroSim.setDrive(',
                       'game.js: guard setDrive after step() nulled neuroSim')

          save('game.js', g)

          # ---------------- fly_rig.js ----------------
          r = load('fly_rig.js')

          def p5(m):
              i = m.group(1)
              L = [
                "s.angleDeg += s.angularVel * dt;",
                "// One non-finite angle would propagate into the joint quaternion and",
                "// blank the whole rig permanently; reset instead of poisoning it.",
                "if (!Number.isFinite(s.angleDeg) || !Number.isFinite(s.angularVel)) {",
                "  s.angleDeg = Number.isFinite(restAngle) ? restAngle : 0;",
                "  s.angularVel = 0;",
                "}",
              ]
              return '\n'.join(i + x for x in L)

          r = sub_once(r, r'^([ \t]*)s\.angleDeg \+= s\.angularVel \* dt;[ \t]*$', p5,
                       'fly_rig.js: NaN guard on per-DOF ragdoll integration')

          def p6(m):
              i = m.group(1)
              L = [
                "rootPhysics.sinkZ += rootPhysics.sinkVel * dt;",
                "// Same guard for the root spring: a non-finite value here would move",
                "// the whole body to NaN and it would never come back.",
                "const rootNums = ['pitchDeg', 'pitchVel', 'rollDeg', 'rollVel',",
                "  'sinkZ', 'sinkVel'];",
                "for (const k of rootNums) {",
                "  if (!Number.isFinite(rootPhysics[k])) {",
                "    rootPhysics.pitchDeg = 0; rootPhysics.pitchVel = 0;",
                "    rootPhysics.rollDeg = 0; rootPhysics.rollVel = 0;",
                "    rootPhysics.sinkZ = 0; rootPhysics.sinkVel = 0;",
                "    break;",
                "  }",
                "}",
              ]
              return '\n'.join(i + x for x in L)

          r = sub_once(r, r'^([ \t]*)rootPhysics\.sinkZ \+= rootPhysics\.sinkVel \* dt;[ \t]*$', p6,
                       'fly_rig.js: NaN guard on root ragdoll spring')

          save('fly_rig.js', r)
          print('ALL ANCHORS OK')
          PY
          python3 /tmp/patch.py

      - name: Syntax-check the patched modules
        run: |
          set -e
          mkdir -p /tmp/js-check
          for f in game.js fly_rig.js; do
            cp "$f" "/tmp/js-check/$(basename "$f" .js).mjs"
            node --check "/tmp/js-check/$(basename "$f" .js).mjs"
          done

      - name: Commit each file separately
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "fix(game.js): wrap fly rig in a parent group for facing, map impulse dir, set rig floorY, guard setDrive after sim failure"
          git add fly_rig.js
          git commit -m "fix(fly_rig.js): reset non-finite ragdoll state instead of poisoning joint/root transforms"
          git push

name: Apply fly fixes

on:
  push:
    paths:
      - '.github/workflows/apply_fly_fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply anchored patches
        run: python3 ci_tmp/apply_fixes.py
      - name: Syntax check
        run: |
          mkdir -p /tmp/js
          cp game.js /tmp/js/game.mjs
          cp fly_rig.js /tmp/js/fly_rig.mjs
          node --check /tmp/js/game.mjs
          node --check /tmp/js/fly_rig.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add game.js fly_rig.js
          git commit -m 'fix(fly): meshScale multiplies STL vertices; add OrbitControls, debug hook, loud fly errors'
          git push

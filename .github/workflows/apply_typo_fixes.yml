name: Apply typo fixes

on:
  push:
    paths:
      - '.github/workflows/apply_typo_fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write patcher
        run: |
          cat > /tmp/typos.py <<'PY'
          # -*- coding: utf-8 -*-
          import io, sys

          PATH = 'game.js'

          # (old, new, why). Plain substring anchors only: no whitespace or
          # line-wrapping assumptions. Each must occur exactly once.
          EDITS = [
              (u'\u0432\u043e\u0437\u0430\u0447\u043d\u043e',
               u'\u0432\u043e\u0437\u043c\u0443\u0442\u0438\u0442\u0435\u043b\u044c\u043d\u043e',
               'vozachno -> vozmutitelno (not a word)'),
              (u'\u0438\u0438\u043c\u0435\u043d\u043d\u043e',
               u'\u0438\u043c\u0435\u043d\u043d\u043e',
               'iimenno -> imenno (doubled letter)'),
              (u'\u041c\u041e\u0418 \u0421\u0410\u0425\u0410\u0420',
               u'\u041c\u041e\u0419 \u0421\u0410\u0425\u0410\u0420',
               'MOI SAHAR -> MOJ SAHAR (gender agreement)'),
              (u'\u0441\u043a\u0440\u0438\u0447\u0430\u0449\u0430\u044f',
               u'\u0441\u043a\u0440\u0438\u043f\u044f\u0449\u0430\u044f',
               'skrichashchaya -> skripyashchaya (creaking door)'),
              (u'\u041f\u041e\u0417\u041e\u0440!',
               u'\u041f\u041e\u0417\u041e\u0420!',
               'POZOr -> POZOR (stray lowercase letter)'),
              (u'\u044f \u0434\u0430\u0436\u0435 \u0443\u0441\u043f\u0435\u043b '
               u'\u0440\u0430\u0437\u043e\u0437\u043b\u0438\u0442\u044c\u0441\u044f',
               u'\u044f \u0434\u0430\u0436\u0435 \u043d\u0435 \u0443\u0441\u043f\u0435\u043b '
               u'\u0440\u0430\u0437\u043e\u0437\u043b\u0438\u0442\u044c\u0441\u044f',
               'missing negation: added "ne" (I did not even get angry in time)'),
              (u'${s} \u0434\u043e\u0432\u0435\u043b\u043e \u043c\u0435\u043d\u044f '
               u'\u0434\u043e \u043f\u0440\u0435\u0434\u0435\u043b\u0430',
               u'${s} \u2014 \u044d\u0442\u043e \u0434\u043e\u0432\u0435\u043b\u043e '
               u'\u043c\u0435\u043d\u044f \u0434\u043e '
               u'\u043f\u0440\u0435\u0434\u0435\u043b\u0430',
               'neuter verb "dovelo" disagreed with non-neuter subjects; anchored to "eto"'),
          ]

          with io.open(PATH, 'r', encoding='utf-8', newline='') as f:
              text = f.read()

          for old, new, why in EDITS:
              n = text.count(old)
              if n != 1:
                  sys.stderr.write('ANCHOR FAILED (%d matches, expected 1): %s\n' % (n, why))
                  sys.exit(1)
              text = text.replace(old, new, 1)
              print('patched: %s' % why)

          with io.open(PATH, 'w', encoding='utf-8', newline='') as f:
              f.write(text)

          print('ALL ANCHORS OK')
          PY
          python3 /tmp/typos.py

      - name: Syntax-check the patched module
        run: |
          set -e
          mkdir -p /tmp/js-check
          cp game.js /tmp/js-check/game.mjs
          node --check /tmp/js-check/game.mjs

      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "fix(game.js): correct Russian typos and agreement in user-visible comment/beetle strings"
          git push
